<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noodle Generator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>Noodle Generator</h1>

<div id="voortgang">
    <div id="stapTekst">Stap 1 van 6
</div>

    <div id="progressBar">
        <div id="progressVulling"></div>
    </div>
</div>

</header>



<main>


<!-- STARTSCHERM -->

<section id="startScherm">

	<h2>Maak jouw perfecte noodle combinatie</h2>

	<div class="button-container">
		<button onclick="startBouwen()">
	    		Stel je noodle bowl samen
		</button>
	</div>
	<div>
		<br/>
		<img src="images/NoodleBowl.png" alt="Noodle Bowl"/>		
	</div>

</section>


<!-- BOUWER -->

<section id="bouwer" style="display:none;">


<div id="stapTitel">

</div>



<div id="keuzes">

</div>



<button id="terugKnop" onclick="gaTerug()">
← Terug
</button>


</section>




<!-- GEKOZEN INGREDIENTEN -->

<div id="gekozenBalk">

</div>




<!-- RESULTAAT -->

<section id="resultaat" style="display:none;">

<h2>Jouw noodle bowl</h2>

<div id="gerecht"></div>

<div id="recept"></div>

<div id="voeding"></div>

</section>




</main>





<script src="data.js"></script>

<script src="recommendations.js"></script>

<script src="recipes.js"></script>

<script src="voeding.js"></script>

<script src="script.js"></script>

</html>
