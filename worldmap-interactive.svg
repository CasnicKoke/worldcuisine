    <!-- Namen -->
    <text class="label" x="205" y="150">
        Noord-Amerika
    </text>

    <text class="label" x="322" y="391">
        Zuid-Amerika
    </text>

    <text class="label" x="565" y="145">
        Europa
    </text>

    <text class="label" x="564" y="287">
        Afrika
    </text>

    <text class="label" x="842" y="173">
        Azië
    </text>

    <text class="label" x="984" y="442">
        Oceanië
    </text>
</svg>