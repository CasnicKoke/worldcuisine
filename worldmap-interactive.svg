	<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1200 620"
    role="img"
    aria-labelledby="mapTitle mapDesc"
>
    <title id="mapTitle">Interactieve wereldkaart</title>

    <desc id="mapDesc">
        Gestileerde wereldkaart met zes klikbare continenten.
    </desc>

    <!-- Achtergrond -->
    <rect
        width="1200"
        height="620"
        rx="30"
        fill="#dff1f3"
    />

    <style>
        .continent {
            stroke: #ffffff;
            stroke-width: 5;
            stroke-linejoin: round;
            cursor: pointer;

            transform-box: fill-box;
            transform-origin: center;

            transition:
                filter 0.2s ease,
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .continent:hover,
        .continent:focus {
            filter:
                brightness(1.12)
                drop-shadow(0 8px 7px rgba(0, 0, 0, 0.25));

            transform: scale(1.025);
            outline: none;
        }

        .continent:focus-visible {
            stroke: #ffd166;
            stroke-width: 8;
        }

        .label {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            font-weight: 700;
            fill: #24332f;
            text-anchor: middle;
            pointer-events: none;

            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 5px;
            stroke-linejoin: round;
        }
    </style>

    <!-- Noord-Amerika -->
    <g
        id="noord-amerika"
        class="continent"
        data-continent="noord-amerika"
        tabindex="0"
        role="button"
        aria-label="Noord-Amerika"
        fill="#4f8fc9"
    >
        <title>Noord-Amerika</title>

        <path
            d="M76 129 L123 87 L196 64 L281 78 L339 107
               L324 145 L289 160 L271 195 L235 207 L214 248
               L174 245 L153 212 L119 197 L93 162 Z"
        />

        <path
            d="M233 246 L273 252 L296 279 L279 294 L250 278 Z"
        />

        <path
            d="M126 69 L158 42 L204 45 L218 68 L181 81 Z"
        />
    </g>

    <!-- Zuid-Amerika -->
    <g
        id="zuid-amerika"
        class="continent"
        data-continent="zuid-amerika"
        tabindex="0"
        role="button"
        aria-label="Zuid-Amerika"
        fill="#67b86e"
    >
        <title>Zuid-Amerika</title>

        <path
            d="M278 300 L327 286 L376 307 L403 348 L394 400
               L367 448 L348 505 L321 566 L297 536 L292 482
               L268 439 L257 386 L240 343 Z"
        />
    </g>

